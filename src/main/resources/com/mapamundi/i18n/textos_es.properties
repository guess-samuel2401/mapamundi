ayuda.1.titulo=Elige el continente
ayuda.1.texto=Aparece un país. Elige su continente con las flechas + Enter, las teclas 1–5 o un clic. Tienes 5 intentos: +100 puntos.
ayuda.2.titulo=Coloca el país
ayuda.2.texto=Arrástralo con el ratón (o usa las flechas; con Shift va más rápido) y pulsa Enter o Confirmar. La rueda del ratón hace zoom.
ayuda.3.titulo=Suma puntos
ayuda.3.texto=Si queda dentro del margen (en km reales): +500 y un bonus por los segundos que sobran. Si fallas o se acaba el tiempo, pierdes un corazón ♥ (tienes 5).
ayuda.4.titulo=Rachas y pistas
ayuda.4.texto=Desde el 4.º acierto seguido los puntos valen ×2, y desde el 8.º, ×3. Si te atascas, pide una pista (descartar continentes, zona o vecinos): su costo se resta de los puntos de esa ronda.
ayuda.5.titulo=Reglas extra
ayuda.5.texto=Contrarreloj: {0} s para toda la partida, sin corazones. Frío o caliente: la pieza cambia de color según lo cerca que esté. Pieza girada: hay que enderezarla con Q / E.
ayuda.6.titulo=Pausa
ayuda.6.texto=F5, P o Esc detienen el cronómetro. F11: pantalla completa.
ayuda.verTutorial=Ver el tutorial
ayuda.creditos=Fronteras: Natural Earth (dominio público). Datos de los países: Wikidata (CC0) y Mapamundi original (2003). Música y efectos de sonido: composiciones originales del juego.
# ---------------------------------------------------------------- tutorial
tutorial.saltar=Saltar
tutorial.atras=Atrás
tutorial.siguiente=Siguiente
tutorial.aJugar=¡A jugar!
tutorial.categorias=Bronce · Plata · Oro
tut.cap.intro=Introducción
tut.cap.moderno=Arrastra y ubica
tut.cap.clasico=Cae y ubica
tut.cap.controles=Controles
tut.bienvenida.titulo=¡Bienvenido a Mapamundi!
tut.bienvenida.texto=Reconoce y ubica los 197 países del mundo jugando. Aquí aprenderás los dos estilos de juego: «Arrastra y ubica» y «Cae y ubica», que recrea el Mapamundi original. Usa las pestañas de arriba para saltar a cualquier parte.
tut.pasos.titulo=Antes de jugar: dos pantallas
tut.pasos.texto=En el paso 1 configuras la partida: el estilo («Arrastra y ubica» o «Cae y ubica»), el nivel, el modo de juego y los continentes. Pulsa Continuar; en el paso 2 revisas el resumen y pulsas ▶ JUGAR o Enter.
tut.modos.titulo=Cinco modos de juego
tut.modos.texto=El modo decide qué ves de cada país: su forma con el nombre o la capital, un círculo de color en lugar de su forma, o solo sus datos (moneda, idioma, población). Los puntos ●○ indican la dificultad. Sirven para ambos estilos.
tut.m1.titulo=Arrastra y ubica · 1. Elige el continente
tut.m1.texto=Aparece un país y eliges su continente con un clic, con las teclas 1 a 5 o con ← → y Enter. Si fallas, la tarjeta se sacude y gastas un intento (tienes 5). Al acertar sumas +100.
tut.m2.titulo=Arrastra y ubica · 2. Colócalo en el mapa
tut.m2.texto=Arrastra la pieza hasta su lugar antes de que se vacíe la barra de tiempo y confirma con Enter. La rueda del ratón hace zoom. Cuanto antes aciertes, más bonus de tiempo.
tut.m3.titulo=Arrastra y ubica · Corazones, rachas y niveles
tut.m3.texto=Cada acierto seguido alarga tu racha: desde el 4.º los puntos valen ×2 y desde el 8.º, ×3. Con 6 aciertos superas el nivel. Si fallas o se acaba el tiempo, se rompe un corazón y la racha vuelve a cero.
tut.m4.titulo=Arrastra y ubica · Pistas
tut.m4.texto=¿Atascado? Pide una pista durante la ronda: descartar continentes, ver la zona donde está o colorear a sus vecinos. Cada pista resta su costo de los puntos de esa ronda.
tut.m5.titulo=Arrastra y ubica · Reglas extra
tut.m5.texto=Actívalas en la configuración. Contrarreloj: un solo reloj para toda la partida y sin corazones. Frío o caliente: la pieza brilla de azul a rojo al acercarse. Pieza girada: enderézala antes de colocarla.
tut.m6.titulo=Arrastra y ubica · Insignias
tut.m6.texto=Por jugar bien ganas insignias: primer país, rachas, puntería, rapidez, continentes completos… Las conseguidas se ven en color en el botón «Logros».
tut.c1.titulo=Cae y ubica · Como el original del 2000
tut.c1.texto=«Cae y ubica» recrea el Mapamundi original: el país cae mientras eliges su continente, la pieza del mapa nunca se detiene y solo tienes 5 errores para toda la partida.
tut.c2.titulo=Cae y ubica · 1. El país va cayendo
tut.c2.texto=El país baja paso a paso. Antes de que llegue abajo, elige su continente: un clic marca la tarjeta y el doble clic la elige (también ← → y Enter, o las teclas 1 a 5).
tut.c3.titulo=Cae y ubica · 2. La pieza no se detiene
tut.c3.texto=En el mapa la pieza avanza sola, despacio. Las flechas cambian su dirección y, mientras las mantienes pulsadas, va más rápido. Pulsa Enter cuando esté sobre su lugar, antes de que se acabe el tiempo.
tut.c4.titulo=Cae y ubica · Errores, puntos y mapas completos
tut.c4.texto=Cada fallo suma un error y al quinto termina la partida. Cada país vale entre +10 y +50 puntos según el modo, y al ubicar todos los países de un continente consigues «Mapa completo».
tut.controles.titulo=Controles
tut.controles.texto=Todo se puede jugar con el ratón o con el teclado. Pulsa ? en cualquier momento para ver la ayuda. ¡Ahora a jugar!
