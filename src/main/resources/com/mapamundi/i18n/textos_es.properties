tut.l.insigniaClasico=Como el Mapamundi original
tut.s.bienvenida.titulo=¡Bienvenido a Mapamundi!
tut.s.bienvenida.texto=Elige un continente y un reto, y a jugar: reconoce cada país lo más rápido que puedas y ubícalo en el mapa antes de que se acabe el tiempo.
tut.s.c1.titulo=Así se juega
tut.s.c1.texto=El país cae mientras eliges su continente, la pieza del mapa nunca se detiene y solo tienes 5 errores para toda la partida. ¡Hay que ser rápido!
tut.s.c2.titulo=1. Reconoce el país antes de que caiga
tut.s.c2.texto=El país baja paso a paso. Antes de que llegue abajo, elige su continente: un clic marca la tarjeta y el doble clic la elige (también ← → y Enter, o las teclas 1 a 5).
tut.s.c3.titulo=2. Llévalo a su lugar
tut.s.c3.texto=En el mapa la pieza avanza sola, despacio. Las flechas cambian su dirección y, mientras las mantienes pulsadas, va más rápido. Pulsa Enter cuando esté sobre su lugar, antes de que se acabe el tiempo.
tut.s.c4.titulo=Errores, puntos y mapas completos
tut.s.c4.texto=Cada fallo suma un error y al quinto termina la partida. Cada país vale entre +10 y +50 puntos según el reto, y al ubicar todos los países de un continente consigues «Mapa completo».
