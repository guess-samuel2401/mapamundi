ayuda.1.titulo=Pick the continent
ayuda.1.texto=A country appears. Choose its continent with the arrow keys + Enter, keys 1–5 or a click. You have 5 tries: +100 points.
ayuda.2.titulo=Place the country
ayuda.2.texto=Drag it with the mouse (or use the arrow keys; hold Shift to go faster) and press Enter or Confirm. The mouse wheel zooms in and out.
ayuda.3.titulo=Score points
ayuda.3.texto=If it lands within the margin (in real km): +500 plus a bonus for the seconds left. If you miss or time runs out, you lose a heart ♥ (you have 5).
ayuda.4.titulo=Streaks and hints
ayuda.4.texto=From the 4th correct answer in a row points are worth ×2, and from the 8th, ×3. If you get stuck, ask for a hint (remove continents, area or neighbours): its cost is taken off that round's points.
ayuda.5.titulo=Extra rules
ayuda.5.texto=Time attack: {0} s for the whole game, with no hearts. Hot or cold: the piece changes colour depending on how close it is. Rotated piece: you must straighten it with Q / E.
ayuda.6.titulo=Pause
ayuda.6.texto=F5, P or Esc stop the timer. F11: full screen.
ayuda.verTutorial=Watch the tutorial
ayuda.creditos=Borders: Natural Earth (public domain). Country facts: Wikidata (CC0) and the original Mapamundi (2003). Music and sound effects: original compositions for the game.
