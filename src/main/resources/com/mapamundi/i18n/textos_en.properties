tut.bienvenida.titulo=Welcome to Mapamundi!
tut.bienvenida.texto=Recognize and place the world's 197 countries by playing. Here you'll learn both game styles: "Drag and place" and "Fall and place", which recreates the original Mapamundi. Use the tabs above to jump anywhere.
tut.pasos.titulo=Before playing: two screens
tut.pasos.texto=In step 1 you set up the game: the style ("Drag and place" or "Fall and place"), the level, the game mode and the continents. Press Continue; in step 2 you review the summary and press ▶ PLAY or Enter.
tut.modos.titulo=Five game modes
tut.modos.texto=The mode decides what you see of each country: its shape with the name or the capital, a coloured circle instead of its shape, or only its facts (currency, language, population). The ●○ dots show the difficulty. They work in both styles.
tut.m1.titulo=Drag and place · 1. Pick the continent
tut.m1.texto=A country appears and you pick its continent with a click, with keys 1 to 5 or with ← → and Enter. If you miss, the card shakes and you use up a try (you have 5). Getting it right adds +100.
tut.m2.titulo=Drag and place · 2. Put it on the map
tut.m2.texto=Drag the piece to its place before the time bar empties and confirm with Enter. The mouse wheel zooms. The sooner you get it right, the bigger the time bonus.
tut.m3.titulo=Drag and place · Hearts, streaks and levels
tut.m3.texto=Each hit in a row extends your streak: from the 4th, points are worth ×2 and from the 8th, ×3. Six hits clear the level. If you miss or time runs out, a heart breaks and the streak resets.
tut.m4.titulo=Drag and place · Hints
tut.m4.texto=Stuck? Ask for a hint during the round: rule out continents, see the area where it is or colour its neighbours. Each hint takes its cost from that round's points.
tut.m5.titulo=Drag and place · Extra rules
tut.m5.texto=Turn them on in the setup. Time attack: a single clock for the whole game and no hearts. Hot or cold: the piece glows from blue to red as it gets closer. Rotated piece: straighten it before placing it.
tut.m6.titulo=Drag and place · Badges
tut.m6.texto=Playing well earns badges: first country, streaks, accuracy, speed, completed continents… The ones you have show in colour under "Badges".
tut.c1.titulo=Fall and place · Like the 2000 original
tut.c1.texto="Fall and place" recreates the original Mapamundi: the country falls while you pick its continent, the map piece never stops and you only have 5 errors for the whole game.
tut.c2.titulo=Fall and place · 1. The country falls
tut.c2.texto=The country drops step by step. Before it reaches the bottom, pick its continent: a click marks the card and a double click chooses it (also ← → and Enter, or keys 1 to 5).
tut.c3.titulo=Fall and place · 2. The piece never stops
tut.c3.texto=On the map the piece moves by itself, slowly. The arrow keys change its direction and, while you hold them, it goes faster. Press Enter when it is over its place, before time runs out.
tut.c4.titulo=Fall and place · Errors, points and complete maps
tut.c4.texto=Each miss adds an error and the fifth one ends the game. Each country is worth +10 to +50 points depending on the mode, and placing every country of a continent gives you "Map complete".
tut.controles.titulo=Controls
tut.controles.texto=Everything can be played with the mouse or the keyboard. Press ? at any time to see the help. Now let's play!
